name: Digest Diário

on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 BRT (UTC-3) todos os dias
  workflow_dispatch:         # permite rodar manualmente no GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  garimpar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Restaurar banco de dados (evitar duplicatas)
        uses: actions/cache@v4
        with:
          path: data/videos.db
          key: videos-db-v1
          restore-keys: videos-db-v1

      - name: Criar pasta data
        run: mkdir -p data

      - name: Rodar digest
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/send_digest.py
